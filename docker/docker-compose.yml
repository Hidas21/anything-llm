name: anythingllm

networks:
  anything-llm:
    driver: bridge

services:
  anything-llm:
    container_name: anythingllm
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
    cap_add:
      - SYS_ADMIN
    environment:
      - STORAGE_DIR=/app/server/storage
    volumes:
      - "./.env:/app/server/.env"
      - "../server/storage:/app/server/storage"
      - "../collector/hotdir/:/app/collector/hotdir"
      - "../collector/outputs/:/app/collector/outputs"
    ports:
      - "3001:3001"
    env_file:
      - .env
    networks:
      - anything-llm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  auth-bridge:
    build: ./auth-bridge
    container_name: auth-bridge
    ports:
      - "8000:8000"
    env_file:
      - ./auth-bridge/.env
    volumes:
      - ./auth-bridge/mapping.yaml:/app/mapping.yaml:ro
    depends_on:
      - anything-llm
      - openldap
    networks:
      - anything-llm
    restart: unless-stopped

  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    environment:
      LDAP_ORGANISATION: "HEPA Corp"
      LDAP_DOMAIN: "hepa.local"
      LDAP_ADMIN_PASSWORD: "admin"
    volumes:
      - ./ldap-seed:/container/service/slapd/assets/config/bootstrap/ldif/custom
    command: --copy-service
    ports:
      - "389:389"
    networks:
      - anything-llm
